<html lang="en">
<head>

    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Share Tech Mono', 'Rajdhani', 'Courier New', monospace;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            text-shadow: 0 0 2px #fff, 0 0 10px #eafff9;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 10;
            pointer-events: none;
        }

        body::after {
            content: "";
            background: url('mu7xo.jpg') no-repeat center center fixed; 
            background-size: 60%;
            background-position: center;    
            opacity: 0.15;
            top: 0; left: 0; bottom: 0; right: 0;
            position: absolute;
            z-index: -1; 
            animation: breathe 12s ease-in-out infinite;
        }

        /* [DATA_WIPE] - THEY_ARE_WATCHING */
        .scan-bar {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(234, 255, 249, 0.3);
            z-index: 1;
            animation: scanline 21s linear infinite, flicker 0.7s infinite;
        }
		
        .crt-overlay { 
            position: fixed; 
            top: 0; left: 0; bottom: 0; right: 0; 
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.35) 0px,
                rgba(0, 0, 0, 0.35) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none; 
            z-index: 999; 
            opacity: 0.65;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.12; }
            50% { transform: scale(1.03); opacity: 0.22; }
        }

        @keyframes scanline {
            0% { top: -10%; }
            8% { top: 110%; }
            100% { top: 110%; }
        }

        @keyframes flicker {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        #terminal { 
            width: 85%; 
            max-width: 500px; 
            border: 1px solid #222; 
            padding: 30px; 
            background: rgba(0, 0, 0, 0.25); 
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9); 
            position: relative;
            z-index: 50;
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
        }

        h1 { 
            font-family: 'Share Tech Mono', monospace; 
            text-align: center;
            font-size: clamp(1.5rem, 6vw, 2.2rem); 
            margin: 0 0 15px 0; 
            text-shadow: 0 0 7px #fff, 0 0 25px #eafff9;
            letter-spacing: 4px;
        }

        label {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            display: block;
            margin-top: 25px;
            text-transform: uppercase;
        }

        input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            border-bottom: 1px solid #444; 
            width: 100%; 
            margin-bottom: 25px; 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 16px; 
            outline: none; 
            border-radius: 0;
            -webkit-appearance: none;
        }

        button { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 18px; 
            cursor: pointer; 
            font-family: 'Share Tech Mono', sans-serif;
            font-weight: 700; 
            font-size: 1.1rem;
            width: 100%; 
            letter-spacing: 6px;
            transition: 0.3s ease;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { background: #444; color: #fff; }

        #error-log { 
            font-family: 'Share Tech Mono', monospace;
            color: #888; 
            margin-top: 25px; 
            font-size: 0.8rem; 
            text-align: center;
            letter-spacing: 1px;
            text-shadow: none;
            height: 1.2rem;
        }

        @media screen and (max-width: 480px) {
            #terminal { width: 90%; padding: 20px; }
            body::after { background-size: 85%; }
        }
    </style>
</head>
<body>

</body>
</html>

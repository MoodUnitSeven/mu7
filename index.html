    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Share Tech Mono', 'Rajdhani', 'Share Tech Mono', 'Courier New', monospace;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            text-shadow: 0 0 2px #fff, 0 0 10px #eafff9;
            -webkit-text-size-adjust: 100%;
        }

        body::after {
            content: "";
            background: url('mu7.jpg') no-repeat center center fixed; 
            background-size: 60%;
            background-position: center;    
            opacity: 0.15; /* Adjusted for better visibility through terminal */
            top: 0; left: 0; bottom: 0; right: 0;
            position: absolute;
            z-index: -1; 
        }

        .crt::before { 
            content: " "; 
            display: block; 
            position: absolute; 
            top: 0; left: 0; bottom: 0; right: 0; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.01)); 
            z-index: 10; 
            background-size: 100% 2px, 3px 100%; 
            pointer-events: none; 
        }
        
        #terminal { 
            width: 85%; 
            max-width: 500px; 
            border: 1px solid #222; 
            padding: 30px; 
            /* Transparent center to see the ghost sigil */
            background: rgba(0, 0, 0, 0.15); 
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9); 
            position: relative;
            z-index: 5;
            /* Cross-browser blur handshake */
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
        }

        /* Monospace Header */
        h1 { 
            font-family: 'Share Tech Mono', monospace; 
            text-align: center;
            font-size: 2.2rem; 
            margin: 0 0 15px 0; 
            text-shadow: 0 0 7px #fff, 0 0 25px #eafff9;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Rajdhani for Labels and Inputs */
        label {
            font-family: 'Share Tech Mono', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            display: block;
            margin-top: 25px;
            text-transform: uppercase;
        }

        input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            border-bottom: 1px solid #444; 
            width: 100%; 
            margin-bottom: 25px; 
            font-family: 'Share Tech Mono', monospace; /* Keep input text clinical */
            font-size: 1.2rem; 
            outline: none; 
            border-radius: 0;
            -webkit-appearance: none;
        }

        button { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 18px; 
            cursor: pointer; 
            font-family: 'Share Tech Mono', sans-serif;
            font-weight: 700; 
            font-size: 1.1rem;
            width: 100%; 
            letter-spacing: 6px;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        button:hover { background: #444; color: #fff; }

        #error-log { 
            font-family: 'Share Tech Mono', monospace;
            color: #888; 
            margin-top: 25px; 
            font-size: 0.8rem; 
            text-align: center;
            letter-spacing: 1px;
        }

        @media screen and (max-width: 480px) {
            h1 { font-size: 1.5rem; letter-spacing: 2px; }
            #terminal { width: 90%; padding: 20px; }
            body::after { background-size: 85%; }
        }
    </style>
</head>
<body class="crt">

</html>
